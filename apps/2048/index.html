<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>2048</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1 class="title">2048</h1>
    <p class="hint">방향키(WASD) 또는 화면을 스와이프해서 타일을 이동하세요. 같은 숫자가 만나면 합쳐집니다.</p>
  </header>

  <div class="toolbar">
    <div class="scoreboard" aria-live="polite">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
    <button type="button" class="btn restart-btn" id="restart-btn">새 게임</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="img" aria-label="2048 게임 보드">
      <div class="grid-bg" id="grid-bg"></div>
      <div class="tile-layer" id="tile-layer"></div>
    </div>

    <div class="overlay" id="win-overlay" hidden>
      <div class="overlay-panel">
        <p class="overlay-title">You Win!</p>
        <p class="overlay-text">2048 타일을 만들었습니다!</p>
        <div class="overlay-actions">
          <button type="button" class="btn" id="continue-btn">계속하기</button>
          <button type="button" class="btn" id="win-restart-btn">다시 시작</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="lose-overlay" hidden>
      <div class="overlay-panel">
        <p class="overlay-title">Game Over</p>
        <p class="overlay-text">최종 점수: <span id="final-score">0</span></p>
        <div class="overlay-actions">
          <button type="button" class="btn" id="lose-restart-btn">다시 시작</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="game.js" defer></script>
</body>
</html>
