<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>픽셀 아트 에디터</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a class="back-link" href="../../index.html">← 블로그로 돌아가기</a>
    <h1 class="title">픽셀 아트 에디터</h1>
    <p class="hint">클릭·드래그 또는 터치로 16x16 격자에 도트를 찍어 그림을 그려보세요.</p>
  </header>

  <div class="main">
    <div class="canvas-block">
      <canvas id="pixel-canvas" role="img" aria-label="16x16 픽셀 아트 캔버스"></canvas>
    </div>

    <div class="control-panel">
      <div class="current-color-row">
        <span class="current-color-label">현재 색상</span>
        <div class="current-color-preview" id="current-color-preview"></div>
        <input type="color" id="custom-color" class="custom-color-input" aria-label="커스텀 색상 선택" value="#0ff0fc" />
      </div>

      <div class="palette" id="palette"></div>

      <div class="tool-row">
        <button type="button" class="btn tool-btn" id="eraser-btn" aria-pressed="false" aria-label="지우개">지우개</button>
        <button type="button" class="btn tool-btn" id="clear-btn">전체 지우기</button>
        <button type="button" class="btn tool-btn save-btn" id="save-btn">PNG로 저장</button>
      </div>
    </div>
  </div>
</div>

<script src="editor.js" defer></script>
</body>
</html>
